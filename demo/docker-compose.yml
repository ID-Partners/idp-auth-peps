# The PDP discovery demo. `docker compose up --build`, then `./demo.sh`.
#
#   stubs           a Trust Anchor, federated and non-federated resources, two banks'
#                   PDPs, an estate-wide PDP and a rogue one — see ../core/cmd/demo-stubs
#   pep-static      coaz-pep as shipped: told where its PDP is, no discovery    :9192
#   pep-resource    PDP_DISCOVERY=resource — trusts each resource's own well-known :9193
#   pep-federation  PDP_DISCOVERY=federation — trusts the federation's word        :9194
#   console         a clickable walkthrough: one request, all three PEPs          :8088
#   kong            (profile `kong`) the Kong plugin doing discovery in Lua        :8000
#
# Everything is plain http on a private network, hence PDP_DISCOVERY_INSECURE. Do not
# copy that line anywhere real.

services:
  stubs:
    build:
      context: ../core
      target: demo-stubs
    environment:
      STUB_HOST: stubs
      ANCHORS_FILE: /shared/anchors.json
    volumes:
      - shared:/shared
    ports:
      - "9000-9009:9000-9009"
      - "9098-9099:9098-9099"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9099/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  pep-static:
    build:
      context: ../core
      target: coaz-pep
    environment: &pep-env
      AUTHZEN_URL: http://stubs:9002/tenants/bank-a
      AUTHZEN_API_KEY: static-pdp-key
      CHECK_API_TOKEN: demo
      MCP_UPSTREAM_ALLOWLIST: http://stubs:9001,http://stubs:9004,http://stubs:9005,http://stubs:9006,http://stubs:9009
      # Short so the console's trace shows the fetches on every run. The shipped
      # default is 5m, and production wants that or longer.
      PDP_METADATA_TTL: 15s
    ports:
      - "9192:9192"
    depends_on:
      stubs:
        condition: service_healthy

  pep-resource:
    build:
      context: ../core
      target: coaz-pep
    environment:
      <<: *pep-env
      PDP_DISCOVERY: resource
      PDP_DISCOVERY_INSECURE: "true"
      # Allowlists match scheme + host + port at a path boundary, so each stub is listed.
      RESOURCE_METADATA_ALLOWLIST: http://stubs:9001,http://stubs:9004,http://stubs:9005,http://stubs:9006,http://stubs:9007,http://stubs:9009,http://pep-federation:9192
      # Deliberately no PDP_ALLOWLIST here (it warns at boot): scenario 2 shows what
      # happens when a resource's own word is the only bound on who decides.
    ports:
      - "9193:9192"
    depends_on:
      stubs:
        condition: service_healthy

  pep-federation:
    build:
      context: ../core
      target: coaz-pep
    environment:
      <<: *pep-env
      PDP_DISCOVERY: federation
      PDP_DISCOVERY_INSECURE: "true"
      RESOURCE_METADATA_ALLOWLIST: http://stubs:9001,http://stubs:9004,http://stubs:9005,http://stubs:9006,http://stubs:9007,http://stubs:9009,http://pep-federation:9192
      PDP_ALLOWLIST: http://stubs:9002,http://stubs:9008,http://stubs:9098
      FEDERATION_TRUST_ANCHORS_FILE: /shared/anchors.json
      # This PEP is also the federation face of the API it fronts: it holds a key, publishes
      # a minimal entity configuration for the anchor to onboard, and republishes what the
      # federation resolves as that API's RFC 9728 document. Nothing about the API's policy
      # is configured here; the anchor maintains it.
      FEDERATION_ENTITY_ID: http://pep-federation:9192
      FEDERATION_ENTITY_KEY_FILE: /tmp/entity-key.json
      FEDERATION_ENTITY_KEY_GENERATE: "true"
      FEDERATION_AUTHORITY_HINTS: http://stubs:9000
      # Which resources may be looked up is RESOURCE_METADATA_ALLOWLIST's call, in every
      # mode; this one governs the climb from a resource to the anchor.
      FEDERATION_FETCH_ALLOWLIST: http://stubs:9000
    volumes:
      - shared:/shared:ro
    ports:
      - "9194:9192"
    depends_on:
      stubs:
        condition: service_healthy

  console:
    build:
      context: ../core
      target: demo-console
    environment:
      LISTEN: ":8088"
      STUBS_BASE: http://stubs
      STUBS_CONTROL: http://stubs:9099
      PEP_STATIC: http://pep-static:9192
      PEP_RESOURCE: http://pep-resource:9192
      PEP_FEDERATION: http://pep-federation:9192
      GATEWAY_ENTITY: http://pep-federation:9192
      CHECK_API_TOKEN: demo
    ports:
      - "8088:8088"
    depends_on:
      stubs:
        condition: service_healthy

  kong:
    profiles: ["kong"]
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PLUGINS: bundled,authzen-pdp
      KONG_LUA_PACKAGE_PATH: /opt/?.lua;;
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
      KONG_LOG_LEVEL: notice
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
      - ../gateways/kong/authzen-pdp:/opt/kong/plugins/authzen-pdp:ro
    ports:
      - "8000:8000"
    depends_on:
      stubs:
        condition: service_healthy

volumes:
  shared:
