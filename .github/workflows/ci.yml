name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only unless a job says otherwise; nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs (the tag is in the comment); Dependabot moves both.
jobs:
  core:
    name: core (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod # the toolchain line: the same compiler the image uses
          cache-dependency-path: core/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
      - name: Coverage ratchet
        run: ../scripts/coverage-gate.sh
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  image:
    name: core image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build --build-arg VERSION=ci -t coaz-pep:ci core
      - name: Refuses to start insecure, starts with the hatch
        # The whole point of the boot check: a PEP with no token verification and an
        # open check API must not come up by accident.
        run: |
          if docker run --rm -e AUTHZEN_URL=http://pdp:8080 coaz-pep:ci; then
            echo "coaz-pep started with no security settings"; exit 1
          fi
          docker run -d --name pep -e AUTHZEN_URL=http://pdp:8080 -e PEP_ALLOW_INSECURE=true coaz-pep:ci
          sleep 2
          test "$(docker inspect -f '{{.State.Running}}' pep)" = true
          test "$(docker inspect -f '{{.Config.User}}' pep)" = nonroot:nonroot
          docker stop pep

  demo:
    name: demo walkthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Stubs, three PEPs and the scripted walkthrough
        run: demo/run-local.sh

  sdk:
    name: sdk/node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    strategy:
      matrix:
        node: ['22', '24'] # the supported LTS lines; 20 reached end of life in April 2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: What would be published
        run: npm pack --dry-run
      - name: Known vulnerabilities
        run: npm audit --audit-level=moderate

  kong:
    name: gateways/kong (lua)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateways/kong
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lua and busted
        # Pin luarocks to 5.4. Ubuntu's luarocks defaults to whichever Lua its VM was
        # built against (5.1), and luacov attributes lines differently across versions —
        # so an unpinned runner measures a different number than a developer does, and
        # the coverage floor becomes unmeetable on one of them.
        # lua-sec gives luarocks native HTTPS, so a rockspec fetch does not fall back to
        # wget against mirrors that time out; the retry covers luarocks.org itself
        # having a bad minute, which is the only reason this job has ever failed.
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks lua-sec
          rocks() {
            for attempt in 1 2 3 4; do
              sudo luarocks --lua-version=5.4 install "$1" && return 0
              echo "luarocks install $1 failed (attempt $attempt); retrying"
              sleep $((attempt * 15))
            done
            return 1
          }
          rocks busted
          rocks luacov
          lua5.4 -v
          busted --version
      - name: Check both plugins parse
        run: |
          for f in authzen-pdp/*.lua sideband-pdp/*.lua; do
            lua5.4 -e "assert(loadfile('$f'))" && echo "ok  $f"
          done
      - name: Behavioural tests (mocked Kong)
        run: busted --lpath="./?.lua;./?/init.lua" spec/
      - name: Coverage ratchet
        run: ../../scripts/lua-coverage-gate.sh

  pingaccess:
    name: gateways/pingaccess (java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21'] # built for 17; PingAccess 9.1 runs 21
    defaults:
      run:
        working-directory: gateways/pingaccess/authzen-pdp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Take the PingAccess Add-on SDK from the public image
        # The SDK is on no Maven repository. The image is public and needs no licence to
        # pull; only running it does. The jar's version is whatever the image ships, so
        # it is read rather than assumed.
        run: ../../../scripts/pingaccess-sdk.sh
      - name: Tests and the coverage ratchet
        run: mvn -B -Dpa.sdk.version="$PA_SDK_VERSION" verify
