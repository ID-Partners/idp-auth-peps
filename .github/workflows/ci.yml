name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      - name: Coverage ratchet
        run: ../scripts/coverage-gate.sh

  sdk:
    name: sdk/node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/node
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  kong:
    name: gateways/kong (lua)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateways/kong
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua and busted
        # Pin luarocks to 5.4. Ubuntu's luarocks defaults to whichever Lua its VM was
        # built against (5.1), and luacov attributes lines differently across versions —
        # so an unpinned runner measures a different number than a developer does, and
        # the coverage floor becomes unmeetable on one of them.
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks
          sudo luarocks --lua-version=5.4 install busted
          sudo luarocks --lua-version=5.4 install luacov
          lua5.4 -v
          busted --version
      - name: Check the plugin parses
        run: |
          for f in authzen-pdp/*.lua; do
            lua5.4 -e "assert(loadfile('$f'))" && echo "ok  $f"
          done
      - name: Behavioural tests (mocked Kong)
        run: busted --lpath="./?.lua;./?/init.lua" spec/
      - name: Coverage ratchet
        run: ../../scripts/lua-coverage-gate.sh
