name: Release

# A tag like v0.4.0 releases every component at that version: the coaz-pep image (with
# an SBOM, build provenance and a keyless cosign signature), the two Kong rocks, the
# PingAccess rule's jar, and the Node SDK on npm. Every component must already say the
# tag's version and CHANGELOG.md must have a section for it — the first job checks.
#
# A tag like v0.4.0-rc1 is a release candidate for 0.4.0, and runs the same jobs with
# nothing final published: the components still say 0.4.0, the image is pushed as
# 0.4.0-rc1 only (never latest or 0.4), the GitHub release is a prerelease, and npm
# only does a dry run, because an npm version is permanent.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  versions:
    name: every component says ${{ github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      base: ${{ steps.v.outputs.base }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          if ! [[ "$v" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-rc[0-9]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is neither vX.Y.Z nor vX.Y.Z-rcN"
            exit 1
          fi
          base="${BASH_REMATCH[1]}"
          prerelease=false
          if [ -n "${BASH_REMATCH[2]}" ]; then prerelease=true; fi
          {
            echo "version=$v"
            echo "base=$base"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          # A candidate is for the version the components already say.
          fail=0
          check() { if ! eval "$2"; then echo "::error::$1 does not say $base"; fail=1; fi; }
          check "Kong authzen-pdp rockspec" "test -f gateways/kong/authzen-pdp/kong-plugin-authzen-pdp-$base-1.rockspec"
          check "Kong sideband-pdp rockspec" "test -f gateways/kong/sideband-pdp/kong-plugin-sideband-pdp-$base-1.rockspec"
          check "Kong authzen-pdp handler" "grep -q 'VERSION = \"$base\"' gateways/kong/authzen-pdp/handler.lua"
          check "Kong sideband-pdp handler" "grep -q 'VERSION = \"$base\"' gateways/kong/sideband-pdp/handler.lua"
          check "PingAccess pom" "grep -q '<version>$base</version>' gateways/pingaccess/authzen-pdp/pom.xml"
          check "Node package.json" "grep -q '\"version\": \"$base\"' sdk/node/package.json"
          check "CHANGELOG.md" "grep -q '^## \[$base\]' CHANGELOG.md"
          exit $fail

  image:
    name: coaz-pep image
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing and provenance
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/coaz-pep
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: core
          target: coaz-pep
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.versions.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image by digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/coaz-pep@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE,,}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/coaz-pep
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  kong:
    name: Kong rocks
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build both rocks from the tag
        # Pure-Lua .all.rock files, the way Kong packages a plugin: built with luarocks
        # make from the checkout (the rockspecs' module paths are repo-relative) and
        # packed from what that installed, so a rock holds the plugin and nothing else of
        # the repository, and installs without fetching anything. authzen-pdp first,
        # because sideband-pdp depends on it: install them in that order too. The
        # rockspecs attached, and the ones inside the rocks, name the tag being released
        # - the candidate's own for a candidate, since the release tag does not exist yet.
        # Ubuntu's luarocks (3.8) looks for the Lua headers before any build, a pure-Lua
        # one included, hence liblua5.4-dev; installing the rocks needs no headers.
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.4 liblua5.4-dev luarocks lua-sec
          base="${{ needs.versions.outputs.base }}"
          mkdir -p dist
          for p in authzen-pdp sideband-pdp; do
            spec="dist/kong-plugin-$p-$base-1.rockspec"
            sed "s/^  tag = \"v[^\"]*\",$/  tag = \"$GITHUB_REF_NAME\",/" "gateways/kong/$p/${spec#dist/}" > "$spec"
            grep -q "^  tag = \"$GITHUB_REF_NAME\",$" "$spec"
            luarocks --lua-version=5.4 lint "$spec"
            luarocks --lua-version=5.4 --tree "$PWD/rocktree" make --deps-mode=one "$spec"
            (cd dist && luarocks --lua-version=5.4 --tree "$PWD/../rocktree" pack "kong-plugin-$p" "$base-1")
          done
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kong
          path: dist/*

  pingaccess:
    name: PingAccess jar
    needs: versions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateways/pingaccess/authzen-pdp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ../../../scripts/pingaccess-sdk.sh
      - run: mvn -B -Dpa.sdk.version="$PA_SDK_VERSION" verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pingaccess
          path: gateways/pingaccess/authzen-pdp/target/authzen-pdp-pingaccess-${{ needs.versions.outputs.base }}.jar
          if-no-files-found: error

  npm:
    name: Node SDK on npm
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance, and trusted publishing when it is configured
    defaults:
      run:
        working-directory: sdk/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run test:coverage
      # A candidate stops short of publishing: an npm version is permanent, and the one
      # package.json says is the release's to publish.
      - if: needs.versions.outputs.prerelease == 'true'
        run: npm publish --dry-run --access public
      # With an NPM_TOKEN secret it publishes with that; without one, npm's trusted
      # publishing (configured on npmjs.com for this repository and workflow) needs no
      # secret at all. Either way the package carries provenance.
      - if: needs.versions.outputs.prerelease != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: GitHub release
    needs: [versions, image, kong, pingaccess]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The release carries the rocks and the jar, by name: a run also holds artifacts
      # that are not the product, such as the Docker build record.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kong
          path: assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pingaccess
          path: assets
      - name: Notes from CHANGELOG.md, assets attached
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.versions.outputs.version }}
          BASE: ${{ needs.versions.outputs.base }}
          PRERELEASE: ${{ needs.versions.outputs.prerelease }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          flags=()
          : > notes.md
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
            printf 'A release candidate for %s. The rocks and the jar attached say %s, and nothing is on npm yet. The notes below are the ones %s will ship with.\n\n' \
              "$BASE" "$BASE" "$BASE" >> notes.md
          fi
          awk -v v="$BASE" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md >> notes.md
          printf '\nImage: `ghcr.io/%s/coaz-pep:%s` (`%s`), signed with cosign (keyless) and attested.\n' \
            "${GITHUB_REPOSITORY_OWNER,,}" "$V" "$DIGEST" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}" assets/*
