# Keeps every dependency moving: Go modules, the Node SDK's dev tooling, the PingAccess
# build, the pinned GitHub Actions and the base images pinned by digest. Minor and patch
# updates are grouped per ecosystem, so a week's bumps arrive as one PR each.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /core
    schedule: { interval: weekly }
    ignore:
      # 1.84.0 still carries GO-2026-6443 (govulncheck: reachable through
      # grpc.Server.Serve); 1.83.2 has the fix. The next release that has it comes through.
      - dependency-name: google.golang.org/grpc
        versions: ["1.84.0"]
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /sdk/node
    schedule: { interval: weekly }
    ignore:
      # Types for the oldest Node the SDK supports (22): newer ones describe APIs the
      # SDK must not use, and drop ones it does.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      # vitest and its coverage provider pin each other's exact version: one moves
      # without the other and npm ci refuses.
      vitest:
        patterns: [vitest, "@vitest/*"]
      node-dev:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /gateways/pingaccess/authzen-pdp
    schedule: { interval: weekly }
    ignore:
      # Taken from the PingAccess image, not a repository: the image tag decides it.
      - dependency-name: com.pingidentity.pingaccess:pingaccess-sdk
      # What PingAccess 9.1 ships in lib/, provided at runtime: the rule compiles against
      # the engine's own versions, so these move with the PingAccess version, by hand.
      - dependency-name: com.fasterxml.jackson.core:jackson-databind
      - dependency-name: org.bitbucket.b_c:jose4j
      - dependency-name: "org.slf4j:*"
      - dependency-name: jakarta.validation:jakarta.validation-api
    groups:
      maven:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/core, /demo/railway, /demo/pingaccess, /gateways/envoy/agentgateway, /site]
    schedule: { interval: weekly }
    ignore:
      # The demo builds the PingAccess rule on JDK 17, its floor, on purpose.
      - dependency-name: maven
